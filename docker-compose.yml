services:
  web:
    image: httpd:2.4
    volumes:
      - ./web/site:/usr/local/apache2/htdocs:ro

  warcgen:
    build: ./python
    depends_on:
      - web
    volumes:
      - ./web/site:/site:ro
      - ./data:/data
    environment:
      - INTERNAL_HOST=http://web/

  fix-links:
    build: ./python
    volumes:
      - ./web/site:/site
    entrypoint: ["python", "fix-links.py"]